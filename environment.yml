# Conda environment for the QAAF release.
#
#   conda env create -f environment.yml
#   conda activate qaaf
#
# CUDA 12.1 builds are pinned because that is what the reported results were
# produced with. Adjust pytorch-cuda to match your driver if needed.
name: qaaf
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.1
  - numpy=2.2.6
  - scipy=1.16.2
  - pandas=2.3.3
  - scikit-learn=1.8.0
  - h5py=3.15.1
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - pillow=12.1.1
  - matplotlib=3.10.7
  - sox
  - pip
  - pip:
      - opencv-python==4.12.0.88
      - transformers==4.50.3
      - timm==0.9.16
      - wandb==0.23.1
